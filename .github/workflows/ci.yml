name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff
      - name: go vet
        run: make vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: Unit tests with the race detector
        run: make test-race
      - name: Integration tests (testcontainers, TimescaleDB)
        run: go test -race -tags integration -count=1 ./internal/store/...

  sqlc:
    name: sqlc generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
      - name: sqlc diff
        run: make sqlc-check

  web:
    name: SvelteKit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: svelte-check
        run: npm run check
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build

  stack:
    name: Compose stack and migrations
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start TimescaleDB and Mosquitto
        run: |
          cp .env.example .env
          make infra
      - name: Migrate up, down and up again
        run: |
          make migrate
          set -a; . ./.env; set +a
          go run ./cmd/migrate down-to 0
          go run ./cmd/migrate up
          go run ./cmd/migrate status
      - name: API health check
        run: |
          set -a; . ./.env; set +a
          go build -o /tmp/coldtrace-api ./cmd/api
          /tmp/coldtrace-api &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/v1/health && exit 0
            sleep 1
          done
          echo "API did not become healthy" >&2
          exit 1
      - name: Compose logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
