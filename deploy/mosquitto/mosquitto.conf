# Local development broker.
#
# Anonymous access is allowed only because the port is published on
# 127.0.0.1 (see compose.yaml). Per-device credentials and topic ACLs replace
# this with the dynamic security plugin when the device registry lands.
listener 1883
protocol mqtt
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Keep QoS 1 messages for sensors that reconnect within a day.
max_queued_messages 10000
persistent_client_expiration 1d

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
